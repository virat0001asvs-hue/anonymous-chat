<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Encrypted Tunnel</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div id="screen-auth" class="window-panel">
        <h2>WebRTC Tunnel</h2>
        <div class="input-group">
            <label>Target Identifier</label>
            <input type="text" id="phone-number" placeholder="Enter target identity">
        </div>
        <div class="input-group">
            <label>Private Key 🔐</label>
            <input type="password" id="secret-key" placeholder="Enter secret key">
        </div>
        <button onclick="sendSecurePing()">Initiate P2P Handshake</button>
    </div>

    <div id="screen-handshake" class="window-panel hidden">
        <h2>Handshake Protocol</h2>
        <div class="prime-box">
            <span class="prime-label">ACTIVE CRYPTO TOKEN</span>
            <span id="display-prime">00000000</span>
        </div>
        <div class="input-group">
            <label>Confirm Prime Number</label>
            <input type="number" id="prime-input" placeholder="Type the prime">
        </div>
        <button onclick="verifyPrimeConnect()">Establish WebRTC Tunnel</button>
    </div>

    <div id="screen-chat" class="window-panel hidden">
        <h2>P2P Encrypted Chat</h2>
        <div id="chat-logs">
            <div class="message system-msg">Tunnel Secured with WebRTC DTLS. Peer-to-Peer Active.</div>
        </div>
        <div class="chat-input-area">
            <label for="file-upload" class="attach-btn">📎</label>
            <input type="file" id="file-upload" class="hidden" accept="image/*,video/*">
            <input type="text" id="msg-input" placeholder="Type..." onkeypress="checkEnter(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
        <button class="btn-kill" onclick="triggerKillSwitch()">Purge Memory</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
