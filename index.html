<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebRTC Elite Tunnel</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div id="screen-auth" class="window-panel">
        <h2>WebRTC Tunnel</h2>
        <div class="input-group">
            <label>Target Identifier</label>
            <input type="text" id="phone-number" placeholder="Enter target ID">
        </div>
        <div class="input-group">
            <label>Private Key 🔐</label>
            <input type="password" id="secret-key" placeholder="Enter secret key">
        </div>
        <button onclick="sendSecurePing()" class="primary-btn">Initiate P2P Handshake</button>
    </div>

    <div id="screen-handshake" class="window-panel hidden">
        <h2>Handshake Protocol</h2>
        <div class="prime-box">
            <span class="prime-label">ACTIVE TOKEN</span>
            <span id="display-prime">00000000</span>
        </div>

        <div class="input-group">
            <label>Confirm Prime Number</label>
            <input type="number" id="prime-input" placeholder="Type the prime">
        </div>
        <button onclick="verifyPrimeConnect()" class="primary-btn">Establish Tunnel</button></div>

        <div id="screen-chat" class="window-panel hidden">
            <h2>E2EE Network Live</h2>
            <div id="chat-logs">
                <div class="message system-msg">Tunnel SEcured. Military-Grade E2EE Active.</div>
            </div>
         <div class="chat-input-area">
            <button onclick="requstCall(true)" class="icon-btn" title="Video Call">🎥</button>
            <button onclick="requestCall(false)" class="icon-btn" title="voice call">📞</button>
            <label for="file-upload" class="icon-btn" title="Send Media">📂</label>
            <input type="file" id="file-upload" class="hidden" accept="image/*,video/*">
            <input type="text" id="msg-input" placeholder="Type a message..." onekeypress="checkEnter(event)">
            <button id="send-btn" onclick="sendMessage()">💬</button>
         </div> 
         <button class="btn-kill" onclick="triggerKillSwitch()">Purge Connection</button>  
        </div>

        <div id="video-conainer" class="hidden">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
            <div class="call-controls">
                <button onclick="endCall()" id="end-call-btn">🔴</button>
            </div>
        </div>

        <div id="incoming-call-modal" class="modal hidden">
            <div class="model-content call-box">
                <div class="call-pulse"></div>
                <h3 id="call-title">Incoming Call...</h3>
                <div class="call-actions">
                    <button onclick="acceptCall()" class="btn-accept">📞 Answer</button>
                    <button onclick="rejecctCall()" class="btn-reject">🔴 Decline</button>
                </div>
            </div>
        </div>

        <div id="image-modal" class="modal hidden" onclick="closeModal()">
            <span class="close-modal">&times;</span>
            <img class="modal-content" id="modal-img">

            <script srs="app.js"></script>
        </div>
